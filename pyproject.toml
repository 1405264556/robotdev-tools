[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robotdev-tools"
version = "0.3.0"
description = "Automated ROS 2 rosbag2 analyzer, validator, diagnostics, and quality reports"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "RobotDev Tools contributors" }]
keywords = [
  "robotics",
  "ros2",
  "rosbag",
  "rosbag2",
  "rosbag2-analyzer",
  "rosbag2-validator",
  "mcap",
  "db3",
  "automated-testing",
  "quality-gate",
  "diagnostics",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "jinja2>=3.1,<4",
  "numpy>=1.24,<3",
  "plotly>=5.24,<7",
  "pyyaml>=6,<7",
  "rosbags>=0.11,<0.12",
  "typer>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/1405264556/robotdev-tools"
Repository = "https://github.com/1405264556/robotdev-tools"
Issues = "https://github.com/1405264556/robotdev-tools/issues"

[project.scripts]
robotdev = "robotdev_tools.cli:app"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
  "types-PyYAML>=6,<7",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robotdev_tools = ["templates/*.j2"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["slow: bounded-memory and larger synthetic workloads"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
packages = ["robotdev_tools"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "numpy",
  "numpy.*",
  "plotly",
  "plotly.*",
  "rosbags",
  "rosbags.*",
  "yaml",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "robotdev_tools.cli"
disallow_untyped_decorators = false
